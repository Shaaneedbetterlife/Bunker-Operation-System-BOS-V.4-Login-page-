<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Design Final</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>

  <body>
    <main class="page-shell">
      <!-- BACKGROUND VIDEO -->
      <div class="video-stage" aria-hidden="true">
        <video
          id="backgroundVideo"
          class="video-background"
          muted
          playsinline
          preload="auto"
        >
          <source src="asset/Background-bos-New.mp4" type="video/mp4" />
        </video>

        <div id="loopMask" class="loop-mask"></div>
      </div>

      <!-- BACKGROUND OVERLAY -->
      <div class="video-overlay" aria-hidden="true"></div>
      <div class="video-vignette" aria-hidden="true"></div>

      <!-- BAGIAN KIRI DESKTOP -->
      <section class="showcase-section">
        <div class="showcase-content">
          <h1 class="showcase-title">
            <span class="title-line">
              <span class="title-accent">B</span>unker
            </span>

            <span class="title-line">
              <span class="title-accent">O</span>peration
            </span>

            <span class="title-line title-line-version">
              <span><span class="title-accent">S</span>ystem</span>
              <span class="version-badge">BOS V.4</span>
            </span>
          </h1>

          <div class="main-description">
            <span class="main-description-company">
              By <strong>Pertamina Trans Kontinental</strong>
            </span>

            <div class="white-stripe" aria-hidden="true">
              <span></span>
            </div>
          </div>
        </div>
      </section>

      <!-- BAGIAN LOGIN -->
      <section class="login-section">
        <!-- TITLE KHUSUS TABLET DAN HP -->
        <h1 class="mobile-login-title">
          <span class="mobile-title-line">
            <span class="title-accent">B</span>unker
          </span>

          <span class="mobile-title-line">
            <span class="title-accent">O</span>peration
          </span>

          <span class="mobile-title-line title-line-version">
            <span><span class="title-accent">S</span>ystem</span>
            <span class="version-badge">BOS V.4</span>
          </span>
        </h1>

        <div class="login-card">
          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="email">Email</label>

              <div class="input-container">
                <i class="fas fa-envelope input-icon"></i>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Email"
                  autocomplete="email"
                  required
                />
              </div>

              <small>Use the email address registered in the BOS system.</small>
            </div>

            <div class="form-group">
              <label for="password">Password</label>

              <div class="input-container">
                <i class="fas fa-lock input-icon"></i>

                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Password"
                  autocomplete="current-password"
                  required
                />

                <button
                  type="button"
                  class="show-password-button"
                  id="togglePassword"
                  aria-label="Show password"
                >
                  <i class="fas fa-eye-slash" id="passwordIcon"></i>
                </button>
              </div>

              <small>Your password is protected and securely encrypted.</small>
            </div>

            <div class="login-options">
              <label class="remember-option" for="rememberMe">
                <input type="checkbox" id="rememberMe" name="rememberMe" />
                <span>Remember Me</span>
              </label>
            </div>

            <button type="submit" class="login-button" id="loginButton">
              <span>Login</span>
              <i class="fas fa-arrow-right"></i>
            </button>

            <div class="divider">
              <span></span>
              <small>OR</small>
              <span></span>
            </div>

            <a href="#" class="idaman-button" id="idamanButton">
              <img
                src="asset/logo_idaman.jpeg"
                alt="Idaman Logo"
                class="idaman-logo"
                onerror="
                  this.style.display = 'none';
                  document.getElementById('idamanFallback').style.display =
                    'flex';
                "
              />

              <span
                class="idaman-fallback"
                id="idamanFallback"
                style="display: none"
              >
                ID
              </span>

              <span>Login with Idaman</span>
            </a>
          </form>
        </div>
      </section>
    </main>

    <script>
      const passwordInput = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");
      const passwordIcon = document.getElementById("passwordIcon");
      const loginForm = document.getElementById("loginForm");
      const loginButton = document.getElementById("loginButton");
      const idamanButton = document.getElementById("idamanButton");

      togglePassword.addEventListener("click", function () {
        const hidden = passwordInput.type === "password";

        passwordInput.type = hidden ? "text" : "password";

        passwordIcon.classList.toggle("fa-eye", hidden);
        passwordIcon.classList.toggle("fa-eye-slash", !hidden);

        togglePassword.setAttribute(
          "aria-label",
          hidden ? "Hide password" : "Show password"
        );
      });

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!loginForm.checkValidity()) {
          loginForm.reportValidity();
          return;
        }

        loginButton.disabled = true;
        loginButton.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i><span> Log in...</span>';

        setTimeout(function () {
          loginButton.disabled = false;
          loginButton.innerHTML =
            '<span>Login</span><i class="fas fa-arrow-right"></i>';
        }, 1500);
      });

      idamanButton.addEventListener("click", function (event) {
        event.preventDefault();

        alert("Untuk API IDAMAN.");
      });

      const backgroundVideo = document.getElementById("backgroundVideo");
      const loopMask = document.getElementById("loopMask");

      const fadeDuration = 1050;
      let isResetting = false;

      function playBackgroundVideo() {
        backgroundVideo.play().catch(function () {});
      }

      function resetBackgroundVideo() {
        if (isResetting) {
          return;
        }

        isResetting = true;
        loopMask.classList.add("is-visible");

        setTimeout(function () {
          backgroundVideo.pause();
          backgroundVideo.currentTime = 0;
          playBackgroundVideo();

          requestAnimationFrame(function () {
            loopMask.classList.remove("is-visible");
          });
        }, fadeDuration);

        setTimeout(function () {
          isResetting = false;
        }, fadeDuration * 2);
      }

      backgroundVideo.addEventListener("timeupdate", function () {
        if (!backgroundVideo.duration || isResetting) {
          return;
        }

        const remainingTime =
          backgroundVideo.duration - backgroundVideo.currentTime;
        const fadeTime = fadeDuration / 1000;

        if (remainingTime <= fadeTime + 0.12) {
          resetBackgroundVideo();
        }
      });

      backgroundVideo.addEventListener("ended", resetBackgroundVideo);
      backgroundVideo.addEventListener("canplay", playBackgroundVideo);

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          playBackgroundVideo();
        }
      });
    </script>
  </body>
</html>
